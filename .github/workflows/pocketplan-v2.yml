name: PocketPlan 2.0 checks
on:
  push:
    branches: [pocketplan-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: JavaScript syntax validation
        run: |
          node --check api/advice.js
          node --check finance.js
          node --check tests/advice.test.js
          node --check tests/finance.test.js
      - name: Unit tests
        run: node --test tests/*.test.js
