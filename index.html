const activeDebts=()=>S.debts.filter(x=>+x.balance>0);
const pkey=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
// Same name (ignoring case/extra spaces) = same person; borrowed adds up, settled subtracts.
function people(){const m=new Map();[...S.entries].reverse().forEach(e=>{if(e.kind!=='borrowed'&&e.kind!=='settled')return;const k=pkey(e.person);if(!k)return;let p=m.get(k);if(!p){p={key:k,name:String(e.person).trim().replace(/\s+/g,' '),borrowed:0,settled:0,rows:[]};m.set(k,p)}if(e.kind==='borrowed')p.borrowed+=+e.amount;else p.settled+=+e.amount;p.rows.unshift(e)});
  return[...m.values()].map(p=>({...p,borrowed:r2(p.borrowed),settled:r2(p.settled),out:r2(p.borrowed-p.settled)})).sort((a,b)=>(b.out>0)-(a.out>0)||b.out-a.out||a.name.localeCompare(b.name))}
const owedTotal=()=>people().reduce((s,p)=>s+Math.max(0,p.out),0);
// How an entry moved the linked account balance (+ in, − out).
const eff=e=>(e.kind==='income'||e.kind==='borrowed')?+e.amount:(e.kind==='expense'||e.kind==='settled'||e.kind==='loanpay')?-e.amount:0;
function paidThisMonth(x){const k=ldate().slice(0,7);return r2(S.entries.filter(e=>e.kind==='loanpay'&&e.debt_id===x.id&&e.date.startsWith(k)).reduce((s,e)=>s+ +e.amount,0))>=+x.emi}
function nextDue(x){const t=new Date();t.setHours(0,0,0,0);const dim=(y,m)=>new Date(y,m+1,0).getDate(),day=Math.max(1,Math.min(31,+x.due_day||1));
  let d=new Date(t.getFullYear(),t.getMonth(),Math.min(day,dim(t.getFullYear(),t.getMonth())));const paid=paidThisMonth(x);
  if(d<t||paid)d=new Date(t.getFullYear(),t.getMonth()+1,Math.min(day,dim(t.getFullYear(),t.getMonth()+1)));
  return{d,n:Math.round((d-t)/864e5),paid}}
// Loan EMIs + dated reminders coming up (or overdue), soonest first.
function upcoming(days){const t=new Date();t.setHours(0,0,0,0);const out=[];
  activeDebts().forEach(x=>{const nd=nextDue(x);if(nd.n<=days)out.push({type:'loan',x,d:nd.d,n:nd.n,amt:Math.min(+x.emi,+x.balance)})});
  S.todos.forEach(x=>{if(x.done||!x.due_date)return;const d=new Date(x.due_date+'T00:00:00'),n=Math.round((d-t)/864e5);if(n<=days)out.push({type:'todo',x,d,n})});
  return out.sort((a,b)=>a.n-b.n)}

const isField=el=>el&&/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)&&el.type!=='checkbox';
function snap(){const o={_y:window.scrollY};document.querySelectorAll('#app [id]').forEach(el=>{if(isField(el))o[el.id]=el.value});return o}
function unsnap(o){if(!o)return;for(const id in o){if(id[0]==='_')continue;const el=document.getElementById(id);if(!isField(el))continue;if(el.tagName==='SELECT'&&![...el.options].some(op=>op.value===o[id]))continue;el.value=o[id]}window.scrollTo(0,o._y)}

async function load(){

  S.cur=S.country==='IN'?'INR':'AED';
  $('#nav').hidden=true;
  $('#app').innerHTML=`<section class="loading-panel"><div class="loading-mascot">🐣</div><h1>Getting your ${S.country==='IN'?'India':'UAE'} space ready…</h1><p>Keeping your accounts separate and tidy.</p><div class="loading-track"><i></i></div></section>`;
  try {
    const [e,d,t,a,b,s]=await Promise.all([q('entries').select('*').eq('country',S.country).order('date',{ascending:false}),q('debts').select('*').eq('country',S.country).order('rate',{ascending:false}),q('todos').select('*').eq('country',S.country).order('created'),q('accounts').select('*').eq('country',S.country).order('name'),q('budgets').select('*').eq('country',S.country).order('category'),q('settings').select('*').maybeSingle()]);
    const failed=[e,d,t,a,b,s].find(x=>x.error);

    S.entries=e.data||[];S.debts=d.data||[];S.todos=t.data||[];S.accounts=a.data||[];S.budgets=b.data||[];if(s.data)S.rate=+s.data.rate;render({tab:true});notifyDue();
  } catch(err) {
    $('#app').innerHTML=`<section class="load-error"><div class="error-emoji">🌦️</div><h1>Couldn't open this workspace</h1><p>Please check your connection and Supabase configuration, then try again.</p><p class="error-detail">${esc(err?.message||'Unexpected error')}</p><div class="error-actions"><button onclick="load()">Try again</button><button class="secondary-button" onclick="switchCountry()">Back to countries</button></div></section>`;

function totals(){const m=inMonth(),inc=sumC(m.filter(x=>x.kind=='income'),'amount'),exp=sumC(m.filter(x=>x.kind=='expense'),'amount'),emi=sumC(activeDebts(),'emi');return{inc,exp,emi,left:inc-exp-emi}}
// Avalanche payoff in display currency: highest interest first, freed EMIs roll forward.
function payoff(extra){
  let d=activeDebts().map(x=>({r:+x.rate,b:cv(x.balance,x.currency||'INR',S.cur),e:cv(x.emi,x.currency||'INR',S.cur)})).sort((a,b)=>b.r-a.r);
  const pot=d.reduce((s,x)=>s+x.e,0)+extra;let m=0,int=0;
  while(d.some(x=>x.b>0)&&m<600){m++;let rest=pot;
    d.forEach(x=>{if(x.b>0){const i=x.b*x.r/1200;int+=i;x.b+=i;const p=Math.min(x.b,x.e);x.b-=p;rest-=p}});
    for(const x of d)if(x.b>0&&rest>0){const p=Math.min(x.b,rest);x.b-=p;rest-=p}}
  return{months:m>=600?null:m,int}}
const ym=n=>n==null?'never at this rate':(n>=12?Math.floor(n/12)+' yr ':'')+(n%12)+' mo';
function solo(x){let b=+x.balance,m=0,r=x.rate/1200;while(b>0&&m<600){b=b*(1+r)-x.emi;m++}return m>=600?null:m}
function trend(){const ms=[...Array(6)].map((_,i)=>{const d=new Date(S.month+'-01');d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});
  const v=ms.map(k=>['income','expense'].map(t=>sumC(inMonth(k).filter(x=>x.kind==t),'amount')));const mx=Math.max(1,...v.flat());
  return `<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Income and expenses, last 6 months">${v.map((p,i)=>`<rect x="${i*50+6}" y="${110-p[0]/mx*100}" width="18" height="${p[0]/mx*100}" rx="3" fill="var(--ok)"/><rect x="${i*50+26}" y="${110-p[1]/mx*100}" width="18" height="${p[1]/mx*100}" rx="3" fill="var(--bad)"/><text x="${i*50+25}" y="125" text-anchor="middle" font-size="9" fill="var(--mute)">${ms[i].slice(5)}</text>`).join('')}</svg><div class="mute"><span class="ok">■</span> Income &nbsp;<span class="bad">■</span> Expenses (in ${S.cur}, last 6 months)</div>`}
function budgetBars(){const sp={};inMonth().filter(x=>x.kind=='expense').forEach(x=>{const k=x.category.toLowerCase();sp[k]=(sp[k]||0)+cv(x.amount,x.currency,S.cur)});
  const lim={};S.budgets.forEach(b=>lim[b.category.toLowerCase()]=cv(b.amount,b.currency,S.cur));
  const ks=[...new Set([...Object.keys(sp),...Object.keys(lim)])];
  return ks.length?ks.map(k=>{const s=sp[k]||0,l=lim[k];const w=l?Math.min(100,s/l*100):100;return `<div><div class="row" style="border:0;padding:6px 0 0"><span>${esc(k)}</span><span class="${l&&s>l?'bad':''}">${fmt(s,S.cur)}${l?' / '+fmt(l,S.cur):' (no budget)'}</span></div><div class="bar"><i class="${l&&s>l?'over':''}" style="width:${w}%;${l?'':'opacity:.35'}"></i></div></div>`}).join(''):'<div class="mute">Add expenses and budgets to see this.</div>'}

// Save an entry, then move the linked account / loan balance. Rolls back if the second step fails.
async function commit({entry,acc,delta=0,debt,newDebtBal}){
  const{data:e,error}=await db.from('entries').insert({...entry,country:S.country}).select().single();if(error)throw error;
  const oldAcc=acc?+acc.balance:null;
  try{
    if(acc){const nb=r2(oldAcc+delta),r=await db.from('accounts').update({balance:nb}).eq('id',acc.id);if(r.error)throw r.error;acc.balance=nb}
    if(debt){const r=await db.from('debts').update({balance:newDebtBal}).eq('id',debt.id);if(r.error)throw r.error;debt.balance=newDebtBal}
  }catch(err){
    await db.from('entries').delete().eq('id',e.id);
    if(acc&&+acc.balance!==oldAcc){await db.from('accounts').update({balance:oldAcc}).eq('id',acc.id);acc.balance=oldAcc}
    throw err}
  S.entries.unshift(e);S.entries.sort((a,b)=>b.date.localeCompare(a.date));
}

async function ask(){
  const o=$('#out'), q=$('#q'), button=document.querySelector('#app button[onclick="ask()"]');
  const question=q?.value.trim()||'';
  if(!o)return;
  if(!question){o.textContent='Type a question first, for example: What is my total balance in India?';return;}
  if(button){button.disabled=true;button.textContent='Working…';}
  o.textContent='Thinking…';
  try{
    const accountTotal=sumC(S.accounts,'balance');
    if(/\b(total|current|overall|combined)?\s*(bank\s+)?(balance|balence|balances)\b|\bhow much money\b/i.test(question) && /\b(balance|balence|money|accounts?|have)\b/i.test(question)){
      const askedIndia=/\bindia\b/i.test(question),askedUae=/\b(uae|united arab emirates|dubai)\b/i.test(question);
      if((askedIndia&&S.country!=='IN')||(askedUae&&S.country!=='AE')){S.ai=`You are currently viewing the ${S.country==='IN'?'India':'UAE'} workspace. Switch to Manage ${askedIndia?'India':'UAE'} to see that workspace’s recorded balances. Your country workspaces are kept separate.`;o.textContent=S.ai;return;}
      const countryName=S.country==='IN'?'India':'UAE';
      S.ai=S.accounts.length?`Your total recorded balance in ${countryName} is ${fmt(accountTotal,S.cur)}.\n\nThis total includes ${S.accounts.length} account(s) you've entered in your ${countryName} workspace. It is based on the records in Money Planner, not a live bank connection.`:`You haven't added any accounts in your ${S.country==='IN'?'India':'UAE'} workspace yet, so I can't calculate a total balance. Open Accounts and add your bank accounts or cash balances first.`;
      o.textContent=S.ai;return;
    }
    const sessionResult=await db.auth.getSession();
    const session=sessionResult?.data?.session;
    if(sessionResult?.error||!session){S.ai='Your login session has expired. Please sign in again, then retry your question.';o.textContent=S.ai;return;}
    const t=totals(),sp={};
    inMonth().filter(x=>x.kind==='expense').forEach(x=>sp[x.category]=(sp[x.category]||0)+cv(x.amount,x.currency,S.cur));
    const summary={note:`Selected financial workspace: ${S.country==='IN'?'India':'UAE'}. Do not convert or combine currencies or infer missing data.`,today:new Date().toLocaleDateString('en-CA'),country:S.country,currency:S.cur,month:S.month,...t,balances:accountTotal,accounts:S.accounts.map(({name,kind,balance,currency})=>({name,kind,balance,currency})),budgets:S.budgets.map(({category,amount,currency})=>({category,amount,currency})),spendByCategory:sp,debts:activeDebts().map(x=>({name:x.name,balance:x.balance,emi:x.emi,rate:x.rate,due_day:x.due_day,currency:x.currency,paidThisMonth:paidThisMonth(x),nextDueDate:ymd(nextDue(x).d)})),borrowedFromPeople:people().map(({name,borrowed,settled,out})=>({name,borrowed,repaid:settled,outstanding:out})),openTodos:S.todos.filter(x=>!x.done).map(({text,due_date,created})=>({text,due_date:due_date||null,created:created||null})),recentTransactions:S.entries.slice(0,80).map(({date,kind,title,category,amount,currency,person})=>({date,kind,title,category,amount,currency,person:person||undefined}))};
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),55000);
    try{
      const r=await fetch('/api/advice',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({summary,question}),signal:controller.signal,cache:'no-store'});
      const payload=await r.json().catch(()=>({}));
      if(!r.ok) S.ai=payload.error||`AI Coach request failed (HTTP ${r.status}). Check Vercel function logs.`;
      else S.ai=payload.text||payload.error||'Vercel AI Gateway returned an empty answer. Please try again.';
    } finally { clearTimeout(timeout); }
    o.textContent=S.ai;
  }catch(e){
    S.ai=e?.name==='AbortError'?'The AI request took too long and was stopped. Please try again; if it repeats, check the Vercel function logs and AI Gateway credits/model access.':`AI Coach error: ${e?.message||'Could not complete the request.'}`;
    o.textContent=S.ai;
  }finally{
    if(button){button.disabled=false;button.textContent='Create my action plan ✦';}
  }
}
