<script>
if(!window.CONFIG||CONFIG.SUPABASE_URL.startsWith('PASTE')){document.getElementById('app').innerHTML='<div class="card"><b>Almost there</b><br>Open <code>config.js</code> and paste your Supabase URL and anon key, then redeploy.</div>';throw new Error('config missing')}
const db=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={tab:'home',country:'',month:new Date().toISOString().slice(0,7),entries:[],debts:[],todos:[],accounts:[],budgets:[],rate:24,cur:'INR',extra:0,ai:''};
// Money helpers: every amount keeps its own currency; totals convert to the display currency.
const cv=(a,f,t)=>f==t?+a:(f=='AED'?a*S.rate:a/S.rate);
const oth=c=>c=='INR'?'AED':'INR';
const fmt=(n,c)=>c=='INR'?'₹'+Math.round(n).toLocaleString('en-IN'):'AED '+Math.round(n).toLocaleString('en-US');
const D=(n,c=S.cur)=>`<b>${fmt(n,c)}</b>`;
const sumC=(a,k)=>a.reduce((s,x)=>s+((x.currency||'INR')===S.cur?+x[k]:0),0);
const cs=id=>`<select id="${id}"><option selected>${S.country==='AE'?'AED':'INR'}</option></select>`;
const inMonth=(k=S.month)=>S.entries.filter(x=>x.date.startsWith(k));

async function load(){
  const q=t=>db.from(t);
  if(!S.country){render();return}
  S.cur=S.country==='IN'?'INR':'AED';
  $('#nav').hidden=true;
  $('#app').innerHTML=`<section class="loading-panel"><div class="loading-mascot">🐣</div><h1>Getting your ${S.country==='IN'?'India':'UAE'} space ready…</h1><p>Keeping your accounts separate and tidy.</p><div class="loading-track"><i></i></div></section>`;
  try {
    const [e,d,t,a,b,s]=await Promise.all([q('entries').select('*').eq('country',S.country).order('date',{ascending:false}),q('debts').select('*').eq('country',S.country).order('rate',{ascending:false}),q('todos').select('*').eq('country',S.country).order('created'),q('accounts').select('*').eq('country',S.country).order('name'),q('budgets').select('*').eq('country',S.country).order('category'),q('settings').select('*').maybeSingle()]);
    const failed=[e,d,t,a,b,s].find(x=>x.error);
    if(failed){$('#app').innerHTML=`<section class="load-error"><div class="error-emoji">🧩</div><h1>Almost there!</h1><p>We couldn't load this workspace. Please check your database setup and try again.</p><p class="error-detail">${esc(failed.error.message||'Unknown database error')}</p><div class="error-actions"><button onclick="load()">Try again</button><button class="secondary-button" onclick="switchCountry()">Back to countries</button></div></section>`;return}
    S.entries=e.data||[];S.debts=d.data||[];S.todos=t.data||[];S.accounts=a.data||[];S.budgets=b.data||[];if(s.data)S.rate=+s.data.rate;render();notifyDue();
  } catch(err) {
    $('#app').innerHTML=`<section class="load-error"><div class="error-emoji">🌦️</div><h1>Couldn't open this workspace</h1><p>Please check your connection and Supabase configuration, then try again.</p><p class="error-detail">${esc(err?.message||'Unexpected error')}</p><div class="error-actions"><button onclick="load()">Try again</button><button class="secondary-button" onclick="switchCountry()">Back to countries</button></div></section>`;
  }
}
function totals(){const m=inMonth(),inc=sumC(m.filter(x=>x.kind=='income'),'amount'),exp=sumC(m.filter(x=>x.kind=='expense'),'amount'),emi=sumC(S.debts,'emi');return{inc,exp,emi,left:inc-exp-emi}}
// Avalanche payoff in display currency: highest interest first, freed EMIs roll forward.
function payoff(extra){
  let d=S.debts.map(x=>({r:+x.rate,b:cv(x.balance,x.currency||'INR',S.cur),e:cv(x.emi,x.currency||'INR',S.cur)})).sort((a,b)=>b.r-a.r);
  const pot=d.reduce((s,x)=>s+x.e,0)+extra;let m=0,int=0;
  while(d.some(x=>x.b>0)&&m<600){m++;let rest=pot;
    d.forEach(x=>{if(x.b>0){const i=x.b*x.r/1200;int+=i;x.b+=i;const p=Math.min(x.b,x.e);x.b-=p;rest-=p}});
    for(const x of d)if(x.b>0&&rest>0){const p=Math.min(x.b,rest);x.b-=p;rest-=p}}
  return{months:m>=600?null:m,int}}
const ym=n=>n==null?'never at this rate':(n>=12?Math.floor(n/12)+' yr ':'')+(n%12)+' mo';
function solo(x){let b=+x.balance,m=0,r=x.rate/1200;while(b>0&&m<600){b=b*(1+r)-x.emi;m++}return m>=600?null:m}
function dueSoon(){const t=new Date();t.setHours(0,0,0,0);return S.debts.map(x=>{let d=new Date(t.getFullYear(),t.getMonth(),Math.min(x.due_day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));
  if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,Math.min(x.due_day,new Date(t.getFullYear(),t.getMonth()+2,0).getDate()));return{x,d,n:Math.round((d-t)/864e5)}}).filter(o=>o.n<=7).sort((a,b)=>a.n-b.n)}
function trend(){const ms=[...Array(6)].map((_,i)=>{const d=new Date(S.month+'-01');d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});
  const v=ms.map(k=>['income','expense'].map(t=>sumC(inMonth(k).filter(x=>x.kind==t),'amount')));const mx=Math.max(1,...v.flat());
  return `<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Income and expenses, last 6 months">${v.map((p,i)=>`<rect x="${i*50+6}" y="${110-p[0]/mx*100}" width="18" height="${p[0]/mx*100}" rx="3" fill="var(--ok)"/><rect x="${i*50+26}" y="${110-p[1]/mx*100}" width="18" height="${p[1]/mx*100}" rx="3" fill="var(--bad)"/><text x="${i*50+25}" y="125" text-anchor="middle" font-size="9" fill="var(--mute)">${ms[i].slice(5)}</text>`).join('')}</svg><div class="mute"><span class="ok">■</span> Income &nbsp;<span class="bad">■</span> Expenses (in ${S.cur}, last 6 months)</div>`}
function budgetBars(){const sp={};inMonth().filter(x=>x.kind=='expense').forEach(x=>{const k=x.category.toLowerCase();sp[k]=(sp[k]||0)+cv(x.amount,x.currency,S.cur)});
  const lim={};S.budgets.forEach(b=>lim[b.category.toLowerCase()]=cv(b.amount,b.currency,S.cur));
  const ks=[...new Set([...Object.keys(sp),...Object.keys(lim)])];
  return ks.length?ks.map(k=>{const s=sp[k]||0,l=lim[k];const w=l?Math.min(100,s/l*100):100;return `<div><div class="row" style="border:0;padding:6px 0 0"><span>${esc(k)}</span><span class="${l&&s>l?'bad':''}">${fmt(s,S.cur)}${l?' / '+fmt(l,S.cur):' (no budget)'}</span></div><div class="bar"><i class="${l&&s>l?'over':''}" style="width:${w}%;${l?'':'opacity:.35'}"></i></div></div>`}).join(''):'<div class="mute">Add expenses and budgets to see this.</div>'}

function render(){
  const a=$('#app'),t=totals(); if(!S.country){$('#nav').hidden=true;a.innerHTML=`<div class="welcome"><div class="eyebrow">YOUR MONEY, WITH A PLAN</div><h1>Make your money<br><span>work for you.</span></h1><p class="lead">A calmer way to track accounts, get debt-free, and stay ahead of every payment.</p><div class="country-grid"><button class="country-card" onclick="chooseCountry('IN')"><span class="flag">🇮🇳</span><span><b>Manage India</b><small>INR · Indian accounts & loans</small></span><span class="arrow">↗</span></button><button class="country-card" onclick="chooseCountry('AE')"><span class="flag">🇦🇪</span><span><b>Manage UAE</b><small>AED · UAE accounts & loans</small></span><span class="arrow">↗</span></button></div><p class="privacy-note">✦ Separate records. No currency conversion. Your financial picture stays in its own lane.</p></div>`;return;} $('#nav').hidden=false;
  $('#nav').innerHTML=[['home','Overview'],['money','Transactions'],['acc','Accounts'],['debts','Loans'],['todo','Reminders'],['ai','AI Coach']].map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('');
  const mon=`<input type="month" value="${S.month}" onchange="S.month=this.value;render()">`;
  if(S.tab=='home'){const p0=payoff(0),p1=payoff(S.extra),due=dueSoon(),have=sumC(S.accounts,'balance');
    a.innerHTML=`<div class="row" style="border:0"><h1>${S.country==='IN'?'🇮🇳 India money overview':'🇦🇪 UAE money overview'}</h1><button class="ghost" onclick="switchCountry()">Switch country</button></div>${mon}
    <div class="card hero"><div class="mute">Left this month after expenses and EMIs</div><div class="big" style="color:${t.left<0?'#ffc2c9':'#fff'}">${fmt(t.left,S.cur)}</div><div class="mute">${S.country==='IN'?'India workspace · INR':'UAE workspace · AED'}</div>
    <div class="row"><span>Income</span><span>${D(t.inc)}</span></div><div class="row"><span>Expenses</span><span>${D(t.exp)}</span></div><div class="row"><span>EMIs per month</span><span>${D(t.emi)}</span></div>
    <div class="row"><span>Cash and bank balance</span><span>${D(have)}</span></div></div>
    <div class="card"><h2 style="margin-top:0">Due in the next 7 days</h2>${due.length?due.map(o=>`<div class="row"><span>${esc(o.x.name)}<div class="mute">${o.n==0?'Today':o.n==1?'Tomorrow':'In '+o.n+' days'} · ${o.d.toDateString().slice(4,10)}</div></span><span>${D(o.x.emi,o.x.currency||'INR')}</span></div>`).join(''):'<div class="mute">No EMIs due this week.</div>'}</div>
    <div class="card"><h2 style="margin-top:0">Spending vs budget</h2>${budgetBars()}</div>
    <div class="card"><h2 style="margin-top:0">Income and expenses</h2>${trend()}</div>
    <div class="card"><h2 style="margin-top:0">Debt-free plan</h2><div class="mute">Total owed ${fmt(sumC(S.debts,'balance'),S.cur)}</div>
    <div class="row"><span>Paying only EMIs</span><b>${ym(p0.months)} · interest ${fmt(p0.int,S.cur)}</b></div>
    <label class="mute">Extra you can pay each month (${S.cur})</label><input type="number" value="${S.extra||''}" placeholder="0" onchange="S.extra=+this.value||0;render()">
    <div class="row"><span>With extra ${fmt(S.extra,S.cur)}</span><b class="ok">${ym(p1.months)} · interest ${fmt(p1.int,S.cur)}</b></div><div class="mute">Highest-interest debt first; freed EMIs roll into the next one.</div></div>
    <div class="card"><h2 style="margin-top:0">Your next best move</h2><p class="mute">Use AI Coach for a practical repayment order based on your balances, interest rates, and monthly cash flow.</p><button onclick="S.tab='ai';render()">Build my debt plan ↗</button></div>
    <button onclick="db.auth.signOut()" class="ghost">Sign out</button>`}
  if(S.tab=='money'){const m=inMonth();
    a.innerHTML=`<h1>Income and expenses</h1>${mon}<div class="card">
    <select id="k"><option value="income">Income (salary)</option><option value="expense" selected>Expense</option></select>
    <input id="ti" placeholder="What for? e.g. Salary, Rent"><div class="grid"><input id="am" type="number" placeholder="Amount">${cs('cu')}</div><input id="dt" type="date" value="${new Date().toISOString().slice(0,10)}">
    <input id="ca" placeholder="Category (Food, Rent…)"><button onclick="addEntry()">Add</button></div>
    <div class="card"><h2 style="margin-top:0">Monthly budget per category</h2><div class="grid"><input id="bc" placeholder="Category"><input id="ba" type="number" placeholder="Limit per month"></div><div class="grid">${cs('bu')}<button onclick="addBudget()">Set budget</button></div>
    ${S.budgets.map(b=>`<div class="row"><span>${esc(b.category)}</span><span>${D(b.amount,b.currency)}<button class="ghost" onclick="del('budgets','${b.id}')">✕</button></span></div>`).join('')}</div>
    <div class="grid"><button onclick="copyPrev()">Copy last month</button><button onclick="exportCsv()">Export CSV</button></div><div class="card">${m.length?m.map(x=>`<div class="row"><div>${esc(x.title)}<div class="mute">${esc(x.category)} · ${x.date}</div></div><div><span class="${x.kind=='income'?'ok':'bad'}">${x.kind=='income'?'+':'−'}</span>${D(x.amount,x.currency||'INR')}<button class="ghost" onclick="del('entries','${x.id}')">✕</button></div></div>`).join(''):'<div class="mute">Nothing this month. Add your salary first.</div>'}</div>`}
  if(S.tab=='acc'){
    a.innerHTML=`<h1>Bank accounts and cash</h1><div class="card"><div class="mute">Total you have</div><div class="big ok">${fmt(sumC(S.accounts,'balance'),S.cur)}</div><div class="mute">≈ ${fmt(cv(sumC(S.accounts,'balance'),S.cur,oth(S.cur)),oth(S.cur))}</div></div>
    <div class="card"><select id="at"><option value="bank">Bank account</option><option value="cash">Cash in hand</option></select><input id="an" placeholder="Name, e.g. SBI savings, Emirates NBD, Wallet"><div class="grid"><input id="ab" type="number" placeholder="Balance">${cs('ac')}</div><button onclick="addAcc()">Add account</button></div>
    <div class="card">${S.accounts.length?S.accounts.map(x=>`<div class="row"><div>${esc(x.name)}<div class="mute">${x.kind=='cash'?'Cash in hand':'Bank'}</div></div><div>${D(x.balance,x.currency)}<button class="ghost" style="color:var(--ok)" onclick="editBal('${x.id}',${x.balance})">Edit</button><button class="ghost" onclick="del('accounts','${x.id}')">✕</button></div></div>`).join(''):'<div class="mute">Add your bank accounts and the cash you hold.</div>'}</div>`}
  if(S.tab=='debts'){
    a.innerHTML=`<h1>Debts and EMIs</h1><div class="card"><input id="dn" placeholder="Loan name"><div class="grid"><input id="db" type="number" placeholder="Balance left"><input id="de" type="number" placeholder="Monthly EMI"><input id="dr" type="number" placeholder="Interest % per year"><input id="dd" type="number" placeholder="Due day (1-31)"></div>${cs('dc')}<button onclick="addDebt()">Add debt</button></div>
    <div class="card">${S.debts.length?S.debts.map(x=>`<div class="row"><div>${esc(x.name)}<div class="mute">Due on ${x.due_day} · ${x.rate}% · clears in ${ym(solo(x))}</div></div><div>${D(x.emi,x.currency||'INR')}<div class="mute">${fmt(x.balance,x.currency||'INR')} left</div><button class="ghost" onclick="del('debts','${x.id}')">✕</button></div></div>`).join(''):'<div class="mute">No debts added.</div>'}</div>`}
  if(S.tab=='todo'){a.innerHTML=`<h1>Reminders</h1><p class="mute">Track EMIs, bills, transfers, and other payments. Browser alerts work while this app is open.</p><div class="card"><button class="ghost" style="color:var(--ok)" onclick="enableReminders()">Enable browser notifications</button><div class="mute">Allow notifications when your browser asks.</div></div><div class="card"><input id="tt" placeholder="e.g. Pay credit card or send rent"><label class="mute">Reminder date (optional)</label><input id="td" type="date"><button onclick="addTodo()">Add reminder</button></div><div class="card">${S.todos.map(x=>`<div class="row"><label><input type="checkbox" style="width:auto" ${x.done?'checked':''} onchange="tick('${x.id}',this.checked)"> <span style="${x.done?'text-decoration:line-through;opacity:.5':''}">${esc(x.text)}<small class="mute" style="display:block">${x.due_date?'Due '+x.due_date:'No date set'}</small></span></label><button class="ghost" onclick="del('todos','${x.id}')">✕</button></div>`).join('')||'<div class="mute">No reminders yet. Add your next EMI, bill, or transfer above.</div>'}</div>`}
  if(S.tab=='ai'){a.innerHTML=`<h1>AI money coach</h1><p class="mute">Advice for ${S.country==='IN'?'India · INR':'UAE · AED'} only. Your other country’s records are not included.</p><div class="card"><h2>What should we work on?</h2><textarea id="q" rows="3" placeholder="Example: Help me choose which debt to clear first, and how much extra I can safely pay each month."></textarea><button onclick="ask()">Create my action plan ✦</button></div><div class="card"><pre id="out">${esc(S.ai)||'Your personalized plan will appear here, based on the records in this country.'}</pre></div>`}
}
function enableReminders(){if(!('Notification' in window))return alert('This browser does not support notifications.');Notification.requestPermission().then(p=>{if(p==='granted'){alert('Notifications enabled. Keep the app open to receive due reminders.');notifyDue()}else alert('Notifications were not enabled. You can change this in browser settings.')})}
function notifyDue(){if(!S.country||!('Notification' in window)||Notification.permission!=='granted')return;const today=new Date().toISOString().slice(0,10);S.todos.filter(x=>!x.done&&x.due_date&&x.due_date<=today).forEach(x=>{const k='reminder:'+S.country+':'+x.id+':'+today;if(!localStorage.getItem(k)){new Notification('Money Planner reminder',{body:x.text});localStorage.setItem(k,'1')}});dueSoon().filter(o=>o.n===0).forEach(o=>{const k='emi:'+S.country+':'+o.x.id+':'+today;if(!localStorage.getItem(k)){new Notification('EMI due today',{body:o.x.name+' · '+fmt(o.x.emi,o.x.currency||S.cur)});localStorage.setItem(k,'1')}})}
setInterval(notifyDue,30*60*1000);
async function chooseCountry(c){if(!['IN','AE'].includes(c))return;const {data,error}=await db.auth.getSession();if(error||!data.session){login('Please sign in again to open your workspace.');return;}S.country=c;S.cur=c==='IN'?'INR':'AED';S.tab='home';S.ai='';await load()}function switchCountry(){S.country='';S.ai='';S.tab='home';render()}
async function add(t,row,opt){row.country=S.country;const{error}=opt?await db.from(t).upsert(row,opt):await db.from(t).insert(row);if(error)alert(error.message);else load()}
const addEntry=()=>{const title=$('#ti').value.trim(),amount=+$('#am').value,date=$('#dt').value;if(!title||!Number.isFinite(amount)||amount<=0||!date)return alert('Enter a description, a valid amount greater than zero, and a date.');return add('entries',{kind:$('#k').value,title,amount,currency:$('#cu').value,date,category:$('#ca').value.trim()||'General'})};
const addBudget=()=>{const category=$('#bc').value.trim(),amount=+$('#ba').value;if(!category||!Number.isFinite(amount)||amount<=0)return alert('Enter a category and a budget greater than zero.');return add('budgets',{category,amount,currency:$('#bu').value},{onConflict:'user_id,category,country'})};
const addAcc=()=>{const name=$('#an').value.trim(),balance=+$('#ab').value;if(!name||!Number.isFinite(balance)||balance<0)return alert('Enter an account name and a valid non-negative balance.');return add('accounts',{name,kind:$('#at').value,balance,currency:$('#ac').value})};
const addDebt=()=>{const name=$('#dn').value.trim(),balance=+$('#db').value,emi=+$('#de').value,rate=+$('#dr').value||0,due=+$('#dd').value||1;if(!name||!Number.isFinite(balance)||balance<=0||!Number.isFinite(emi)||emi<=0||rate<0||due<1||due>31)return alert('Check the loan name, balance, EMI, interest rate, and due day (1–31).');return add('debts',{name,balance,emi,rate,due_day:due,currency:$('#dc').value})};
const addTodo=()=>{const text=$('#tt').value.trim();if(!text)return alert('Enter a task first.');return add('todos',{text,due_date:$('#td').value||null})};
const del=async(t,id)=>{await db.from(t).delete().eq('id',id);load()};
const tick=async(id,v)=>{await db.from('todos').update({done:v}).eq('id',id);load()};
const editBal=async(id,old)=>{const v=prompt('New balance',old);if(v!==null&&v!==''){await db.from('accounts').update({balance:+v}).eq('id',id);load()}};
async function setRate(v){if(!(v>0))return;S.rate=v;await db.from('settings').upsert({rate:v},{onConflict:'user_id'});render()}
async function liveRate(){try{const j=await(await fetch('https://open.er-api.com/v6/latest/AED')).json();setRate(+j.rates.INR.toFixed(2))}catch(e){alert('Could not fetch the live rate. Type it in instead.')}}
async function ask(){
  const o=$('#out'), q=$('#q'), button=document.querySelector('#app button[onclick="ask()"]');
  const question=q?.value.trim()||'';
  if(!o)return;
  if(!question){o.textContent='Type a question first, for example: What is my total balance in India?';return;}
  if(button){button.disabled=true;button.textContent='Working…';}
  o.textContent='Thinking…';
  try{
    const accountTotal=sumC(S.accounts,'balance');
    if(/\b(total|current|overall|combined)?\s*(bank\s+)?balance\b|\bhow much money\b/i.test(question) && /\b(balance|money|accounts?|have)\b/i.test(question)){
      const countryName=S.country==='IN'?'India':'UAE';
      S.ai=S.accounts.length?`Your total recorded balance in ${countryName} is ${fmt(accountTotal,S.cur)}.\n\nThis total includes ${S.accounts.length} account(s) you've entered in your ${countryName} workspace. It is based on the records in Money Planner, not a live bank connection.`:`You haven't added any accounts in your ${S.country==='IN'?'India':'UAE'} workspace yet, so I can't calculate a total balance. Open Accounts and add your bank accounts or cash balances first.`;
      o.textContent=S.ai;return;
    }
    const sessionResult=await db.auth.getSession();
    const session=sessionResult?.data?.session;
    if(sessionResult?.error||!session){S.ai='Your login session has expired. Please sign in again, then retry your question.';o.textContent=S.ai;return;}
    const t=totals(),sp={};
    inMonth().filter(x=>x.kind==='expense').forEach(x=>sp[x.category]=(sp[x.category]||0)+cv(x.amount,x.currency,S.cur));
    const summary={note:`Selected financial workspace: ${S.country==='IN'?'India':'UAE'}. Do not convert or combine currencies or infer missing data.`,country:S.country,currency:S.cur,month:S.month,...t,balances:accountTotal,accounts:S.accounts.map(({name,kind,balance,currency})=>({name,kind,balance,currency})),budgets:S.budgets.map(({category,amount,currency})=>({category,amount,currency})),spendByCategory:sp,debts:S.debts.map(({name,balance,emi,rate,due_day,currency})=>({name,balance,emi,rate,due_day,currency})),openTodos:S.todos.filter(x=>!x.done).map(x=>x.text)};
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),55000);
    try{
      const r=await fetch('/api/advice',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({summary,question}),signal:controller.signal,cache:'no-store'});
      const payload=await r.json().catch(()=>({}));
      if(!r.ok) S.ai=payload.error||`AI Coach request failed (HTTP ${r.status}). Check Vercel function logs.`;
      else S.ai=payload.text||payload.error||'Gemini returned an empty answer. Please try again.';
    } finally { clearTimeout(timeout); }
    o.textContent=S.ai;
  }catch(e){
    S.ai=e?.name==='AbortError'?'The AI request took too long and was stopped. Please try again; if it repeats, check the Vercel function logs and Gemini API quota.':`AI Coach error: ${e?.message||'Could not complete the request.'}`;
    o.textContent=S.ai;
  }finally{
    if(button){button.disabled=false;button.textContent='Create my action plan ✦';}
  }
}
async function copyPrev(){const d=new Date(S.month+'-01');d.setMonth(d.getMonth()-1);const rows=inMonth(d.toISOString().slice(0,7));
  if(!rows.length)return alert('Nothing recorded last month.');if(!confirm('Copy '+rows.length+' items from last month into '+S.month+'?'))return;
  const{error}=await db.from('entries').insert(rows.map(x=>({kind:x.kind,title:x.title,amount:x.amount,currency:x.currency,category:x.category,date:S.month+'-'+String(Math.min(28,+x.date.slice(8))).padStart(2,'0')})));if(error)alert(error.message);else load()}
function exportCsv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv=['date,kind,title,category,amount,currency',...S.entries.map(x=>[x.date,x.kind,q(x.title),q(x.category),x.amount,x.currency].join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='money-planner.csv';a.click()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
function login(msg=''){$('#nav').hidden=true;$('#app').innerHTML=`<section class="login-shell"><div class="login-art"><div class="art-spark spark-one">✦</div><div class="art-spark spark-two">✧</div><div class="money-mascot"><div class="mascot-leaf">🌱</div><div class="mascot-face"><span class="eye"></span><span class="eye"></span><span class="cheek left"></span><span class="cheek right"></span><span class="smile"></span></div><div class="mascot-body">₹ <span>♥</span></div></div><div class="floating-coin coin-one">₹</div><div class="floating-coin coin-two">✦</div><div class="art-caption"><b>Little steps. Big progress.</b><span>Your money journey starts here.</span></div></div><div class="login-panel"><div class="brand-mark">🐣 <span>PocketPlan</span></div><div class="eyebrow">YOUR FRIENDLY MONEY SPACE</div><h1>Hey there!<br><span>Let’s get you</span><br>money-ready.</h1><p class="lead">A little more clarity, a little less money stress.</p><form class="login-form" onsubmit="event.preventDefault();signIn()"><label for="em">Email address</label><input id="em" type="email" placeholder="you@example.com" autocomplete="username" required><label for="pw">Password</label><input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="login-button" type="submit">Let’s go <span>→</span></button><div class="bad login-error">${msg}</div></form><div class="login-foot">🔒 Private, secure, and just for you</div></div></section>`}

db.auth.onAuthStateChange((_,s)=>s?load():login());

</script></body></html>
